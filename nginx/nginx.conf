events {
    worker_connections 1024;
}

http {
     
    server_tokens off;
    charset utf-8;

    server {
        listen 80;
        server_name edugenius.tech www.edugenius.tech;

        # Serve Certbot challenge files
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

         
    }

    

    server {
        listen 443 ssl;
        server_name edugenius.tech www.edugenius.tech;

        # SSL Certificate and Key
        ssl_certificate /etc/letsencrypt/live/edugenius.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/edugenius.tech/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/edugenius.tech/chain.pem;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_dhparam /etc/ssl/certs/dhparam.pem;

        # Serve Flutter Web App at /app
        location /app/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /app/index.html;

            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Content-Type';
        }

        # Static files
        location /static/ {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Content-Type';
            
            alias /var/www/edugenius.tech/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, must-revalidate";
            include  "/etc/nginx/mime.types";
        }

        # Media files
        location /media/ {

            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Content-Type';

            alias /media/;
            expires 30d;
            access_log off;
        }

        # Proxy to Django Backend
        location / {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;

            # Optional: This will allow larger file uploads
            client_max_body_size 100M;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }   
        location ~* \.json$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/json;
            add_header Cache-Control "no-store";
            try_files $uri =404;
        } 
        location ~* \.js$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }
    }
}