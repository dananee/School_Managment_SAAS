<!-- templates/reset_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://unpkg.com/htmx.org@1.7.0"></script>
</head>
<body>
    <div id="reset-password-container">
        <!-- Reset Password Form -->
        <form hx-post="/auth/users/reset_password_confirm/" hx-target="#response" hx-swap="innerHTML">
            <h3>Reset Password</h3>
            <input type="hidden" name="uid" value="{{ uidb64 }}">
            <input type="hidden" name="token" value="{{ token }}">
            <label for="new_password">New Password:</label>
            <input type="password" name="new_password" id="new_password" required>
            <label for="re_new_password">Confirm New Password:</label>
            <input type="password" name="re_new_password" id="re_new_password" required>
            <button type="submit">Reset Password</button>
        </form>

        <!-- Response Area -->
        <div id="response"></div>
    </div>
</body>
</html>
