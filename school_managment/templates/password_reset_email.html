<!-- password_reset_confirm.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Confirmation</title>
</head>
<body>
    <h1>Password Reset Confirmation</h1>
    <form id="password-reset-form" method="post">
        {% csrf_token %}
        <label for="password">New Password:</label><br>
        <input type="password" id="password" name="password"><br>
        <label for="password_confirm">Confirm Password:</label><br>
        <input type="password" id="password_confirm" name="password_confirm"><br>
        <button type="submit">Reset Password</button>
    </form>
    <div id="message"></div>

    <script>
        document.getElementById('password-reset-form').addEventListener('submit', function(event) {
            event.preventDefault();
            var form = this;
            var formData = new FormData(form);

            fetch('/api/password/reset/confirm/{{ uidb64 }}/{{ token }}/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('message').textContent = data.detail;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
